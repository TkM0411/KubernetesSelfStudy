apiVersion: v1
kind: Pod
metadata:
  name: nginxbarepod-dev
  labels:
    environment: dev
spec:
  containers:
    - name: nginxbarecontainer
      image: nginx
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: nginxbarepod-prod
  labels:
    environment: prod
spec:
  containers:
    - name: nginxbarecontainer
      image: nginx
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: alpine-dev
  labels:
    environment: dev
    techstack: alpine
spec:
  containers:
    - name: alpinebarecontainer
      image: alpine
      command: ["sleep", "3600"]