apiVersion: v1
kind: Pod
metadata:
  name: init-container-pod
spec:
  restartPolicy: OnFailure
  initContainers:
    - name: shared-volume-update
      image: busybox
      volumeMounts:
        - name: shared-volume
          mountPath: /usr/share/nginx/html
      command:
        - sh
        - -c
        - echo 'Hello from the Init Container' > /usr/share/nginx/html/index.html
  containers:
    - name: nginx-container
      image: nginx
      ports:
        - containerPort: 80
          hostPort: 80
          protocol: TCP
      volumeMounts:
        - name: shared-volume
          mountPath: /usr/share/nginx/html
  volumes:
    - name: shared-volume
      emptyDir: {}