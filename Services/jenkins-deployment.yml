apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins-server
  labels:
    app: jenkinsdeployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: jenkins
  template:
    metadata:
      labels:
        app: jenkins
    spec:
      containers:
        - name: jenkinscontainer
          image: jenkins/jenkins:lts
          ports:
            - containerPort: 8080